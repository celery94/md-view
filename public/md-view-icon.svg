<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop shadow for M letterform -->
    <filter id="mShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <!-- Drop shadow for eye badge -->
    <filter id="eyeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Rausch background -->
  <rect width="512" height="512" rx="112" fill="#ff385c"/>
  <!-- Subtle inner border ring -->
  <rect x="3" y="3" width="506" height="506" rx="110" stroke="white" stroke-opacity="0.15" stroke-width="6" fill="none"/>

  <!-- Bold geometric M letterform -->
  <g filter="url(#mShadow)">
    <path d="M 76 80 L 151 80 L 256 250 L 361 80 L 436 80
             L 436 420 L 361 420 L 361 206 L 256 383
             L 151 206 L 151 420 L 76 420 Z"
          fill="#ffffff"/>
  </g>

  <!-- Preview eye badge – overlaps bottom-right corner of M -->
  <g filter="url(#eyeShadow)">
    <!-- Eye whites -->
    <ellipse cx="390" cy="420" rx="72" ry="49" fill="#ffffff"/>
    <!-- Iris -->
    <circle cx="390" cy="420" r="27" fill="#222222"/>
    <!-- Pupil -->
    <circle cx="390" cy="420" r="13" fill="#111111"/>
    <!-- Primary catchlight -->
    <circle cx="404" cy="410" r="10" fill="white" fill-opacity="0.88"/>
    <!-- Secondary catchlight -->
    <circle cx="381" cy="428" r="4" fill="white" fill-opacity="0.42"/>
  </g>
</svg>
